{{- if not .Values.secret.existingSecret }}
{{- $name := include "riosoma.fullname" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := dict }}
{{- range $key, $value := .Values.secret.values }}
{{- if and (not (kindIs "invalid" $value)) (ne (toString $value) "") }}
{{- $_ := set $data $key (toString $value | b64enc) }}
{{- end }}
{{- end }}
{{- if not (hasKey $data "RIOSOMA_SECRET_KEY") }}
{{- if and $existing $existing.data (hasKey $existing.data "RIOSOMA_SECRET_KEY") }}
{{- $_ := set $data "RIOSOMA_SECRET_KEY" (index $existing.data "RIOSOMA_SECRET_KEY") }}
{{- else }}
{{- /* randBytes returns base64 already, which is the form RIOSOMA_SECRET_KEY takes. */}}
{{- $_ := set $data "RIOSOMA_SECRET_KEY" (randBytes 32 | b64enc) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "riosoma.labels" . | nindent 4 }}
  annotations:
    # The secret key seals stored credentials, so it must outlive an uninstall.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- toYaml $data | nindent 2 }}
{{- end }}
