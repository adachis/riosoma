{{- if .Values.postgresql.enabled }}
{{- $name := include "riosoma.postgresql.fullname" . }}
{{- $pg := .Values.postgresql }}
{{- if and $pg.password (not (regexMatch "^[A-Za-z0-9]+$" (toString $pg.password))) }}
{{- fail "postgresql.password may use only letters and digits, since it goes into a URL" }}
{{- end }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := "" }}
{{- if $pg.password }}
{{- $password = toString $pg.password | b64enc }}
{{- else if and $existing $existing.data (hasKey $existing.data "password") }}
{{- $password = index $existing.data "password" }}
{{- else }}
{{- $password = randAlphaNum 32 | b64enc }}
{{- end }}
# A PostgreSQL for trying Riosoma out, not for production: use a managed database there.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "riosoma.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
  annotations:
    # The data volume outlives an uninstall, so its password must too.
    helm.sh/resource-policy: keep
type: Opaque
data:
  password: {{ $password }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "riosoma.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  type: ClusterIP
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
  selector:
    {{- include "riosoma.postgresql.selectorLabels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "riosoma.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "riosoma.postgresql.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "riosoma.postgresql.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The postgres user in the Alpine image.
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: {{ printf "%s:%s" $pg.image.repository $pg.image.tag | quote }}
          imagePullPolicy: {{ $pg.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: POSTGRES_DB
              value: {{ $pg.database | quote }}
            - name: POSTGRES_USER
              value: {{ $pg.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $name }}
                  key: password
            # A directory below the mount, so a volume's lost+found doesn't stop initdb.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgresql
              containerPort: 5432
          startupProbe:
            exec:
              command: ['pg_isready', '-h', '127.0.0.1', '-U', {{ $pg.username | quote }}, '-d', {{ $pg.database | quote }}]
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec:
              command: ['pg_isready', '-h', '127.0.0.1', '-U', {{ $pg.username | quote }}, '-d', {{ $pg.database | quote }}]
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ['pg_isready', '-h', '127.0.0.1', '-U', {{ $pg.username | quote }}, '-d', {{ $pg.database | quote }}]
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml $pg.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "riosoma.postgresql.selectorLabels" . | nindent 10 }}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with $pg.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $pg.persistence.size }}
{{- end }}
