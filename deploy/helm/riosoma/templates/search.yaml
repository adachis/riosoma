{{- if .Values.search.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "riosoma.fullname" . }}-search
data:
  settings.yml: |
    use_default_settings: true
    server:
      limiter: false
      public_instance: false
      image_proxy: false
    search:
      formats: [json]
    outgoing:
      request_timeout: 8
      max_request_timeout: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "riosoma.fullname" . }}-search
spec:
  selector:
    app.kubernetes.io/name: {{ include "riosoma.name" . }}-search
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "riosoma.fullname" . }}-search
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "riosoma.name" . }}-search
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "riosoma.name" . }}-search
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: search
          image: {{ .Values.search.image | quote }}
          env:
            # ConfigMap files are read-only, so the entrypoint must not change their ownership.
            - name: FORCE_OWNERSHIP
              value: 'false'
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "search.existingSecret is required" .Values.search.existingSecret | quote }}
                  key: secret-key
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.search.resources | nindent 12 }}
          volumeMounts:
            - name: settings
              mountPath: /etc/searxng/settings.yml
              subPath: settings.yml
      volumes:
        - name: settings
          configMap:
            name: {{ include "riosoma.fullname" . }}-search
{{- end }}
