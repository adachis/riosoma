# helm test: asks the Service for /healthz from inside the cluster, with the Riosoma image's own Node.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "riosoma.fullname" . }}-test-healthz
  labels:
    {{- include "riosoma.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  enableServiceLinks: false
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: healthz
      image: {{ include "riosoma.image" . | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      args:
        - -e
        - >-
          fetch('http://{{ include "riosoma.fullname" . }}:{{ .Values.service.port }}/healthz')
          .then((r) => r.json().then((b) => { console.log(r.status, JSON.stringify(b)); process.exit(r.ok && b.status === 'ok' ? 0 : 1); }))
          .catch((e) => { console.error(e.message); process.exit(1); })
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 128Mi
