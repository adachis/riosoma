# Why each direct dependency is here, one table per package directory.  CI checks this file with
# tools/ci/check_dependencies.py: every direct dependency needs a reason, every entry must still be
# declared, and every declared dependency must be used.  Workspace packages (workspace:*) need no
# entry.  For a dependency used in a way the scan cannot see, write an inline table with the reason
# and an "unseen" note saying how it is used.  See docs/developer/dependencies.md.

